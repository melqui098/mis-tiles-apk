name: Construir APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Firma fija y número de versión (para que cada APK se instale encima del anterior)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle
      - name: Pantalla vertical
        run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Compilar
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mis-tiles-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar el APK en la rama apk-build
        run: |
          mkdir /tmp/out
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/mis-tiles.apk
          cd /tmp/out
          git init -q -b apk-build
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add mis-tiles.apk
          git commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-build
